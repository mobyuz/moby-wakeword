# Release gates. The owner confirmed these values (relayed to the W2 session by the delegating
# agent; the confirmation date is not recorded here). They are now binding for the release gate.
status: confirmed-by-owner
false_wakes_per_hour_max: 1.0          # at most 1 false wake per hour
recall_quiet_1m_min: 0.90              # quiet room, 1 m
recall_3m_or_moderate_noise_min: 0.75  # 3 m, or moderate noise
negative_audio_hours_min: 10           # configurable; never used in training
# A release below these gates stops, unless an explicit override flag is used and the
# override is recorded in the report (plan).
override_flag: "--override-gates"
